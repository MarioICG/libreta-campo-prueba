<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13303A">
<meta name="description" content="Libreta de campo con fotos georreferenciadas, marca de agua con norte y exportación a SIG.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Libreta de campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/leaflet/leaflet.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script src="vendor/piexif.js" defer></script>
<script src="vendor/wmm.js" defer></script>
<script src="vendor/geoide.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4Zm0 0v13.5m6-11v13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm3 0v18M12 8h4M12 12h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4A1.5 1.5 0 0 1 9.8 5h4.4a1.5 1.5 0 0 1 1.2.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-proj" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4.5v5M8 14.5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4 8V4m0 4h4M4.6 8A8 8 0 1 1 4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M20 8V4m0 4h-4m3.4 0A8 8 0 1 0 20 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m3 16 5-5 4 4 3-3 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16" cy="9" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-torch" viewBox="0 0 24 24"><path d="M13 2 5 13h6l-1 9 8-11h-6l1-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-gps" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sys" viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <button class="proj-btn" id="proj-btn" aria-haspopup="dialog">
      <span class="proj-name" id="proj-name">Proyecto</span>
      <svg class="ico sm"><use href="#i-down"/></svg>
    </button>
    <div class="gps-pill" id="gps-pill" data-q="sin" role="status" aria-live="polite">
      <i class="gps-dot"></i><span id="gps-text">Buscando GPS…</span>
    </div>
  </header>

  <main id="views">
    <section class="view" id="view-mapa" aria-label="Mapa">
      <div id="map"></div>
      <button class="map-btn" id="btn-me" aria-label="Centrar en mi posición"><svg class="ico"><use href="#i-locate"/></svg></button>
      <button class="map-btn second" id="btn-fit" aria-label="Ver todos los puntos"><svg class="ico"><use href="#i-fit"/></svg></button>
    </section>

    <section class="view paper" id="view-libreta" aria-label="Libreta" hidden>
      <div class="list" id="list"></div>
    </section>

    <section class="view paper" id="view-proyecto" aria-label="Proyecto" hidden>
      <div class="proj" id="proj"></div>
    </section>
  </main>

  <button class="fab" id="fab-punto"><svg class="ico"><use href="#i-plus"/></svg><span>Punto</span></button>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" data-view="mapa" aria-current="page"><svg class="ico"><use href="#i-map"/></svg><span>Mapa</span></button>
    <button class="tab" data-view="libreta"><svg class="ico"><use href="#i-book"/></svg><span>Libreta</span></button>
    <button class="tab shutter-tab" id="tab-cam" aria-label="Cámara"><span class="shutter-mini"><svg class="ico"><use href="#i-cam"/></svg></span></button>
    <button class="tab" data-view="proyecto"><svg class="ico"><use href="#i-proj"/></svg><span>Proyecto</span></button>
  </nav>
</div>

<!-- Ficha de punto -->
<div class="overlay sheet paper" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-code">
  <header class="sheet-head">
    <button class="icon-btn" id="sheet-close" aria-label="Cerrar"><svg class="ico"><use href="#i-back"/></svg></button>
    <input class="sheet-code" id="sheet-code" aria-label="Código del punto" spellcheck="false" autocomplete="off">
    <span class="saved" id="sheet-saved"></span>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<!-- Cámara -->
<div class="overlay camera" id="camera" hidden role="dialog" aria-modal="true" aria-label="Cámara">
  <video id="cam-video" playsinline muted></video>
  <div class="cam-flash" id="cam-flash"></div>
  <div class="cam-top">
    <canvas id="tape" class="tape" aria-hidden="true"></canvas>
    <div class="cam-readout"><span id="cam-az">—</span><span id="cam-card"></span></div>
    <div class="cam-chips">
      <span class="chip" id="cam-gps"></span>
      <button class="chip chip-btn" id="cam-target"></button>
    </div>
    <div class="cam-hint" id="cam-hint" hidden></div>
  </div>
  <div class="cam-bottom">
    <button class="cam-thumb" id="cam-thumb" aria-label="Ver última foto"></button>
    <button class="shutter" id="shutter" aria-label="Tomar foto"><span></span></button>
    <div class="cam-side">
      <button class="icon-btn light" id="cam-torch" aria-label="Linterna" hidden><svg class="ico"><use href="#i-torch"/></svg></button>
      <button class="icon-btn light" id="cam-sys" aria-label="Usar la cámara del sistema"><svg class="ico"><use href="#i-sys"/></svg></button>
      <button class="done-btn" id="cam-done">Listo</button>
    </div>
  </div>
  <input type="file" accept="image/*" capture="environment" id="sys-input" hidden>
</div>

<!-- Visor de foto -->
<div class="overlay viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Foto">
  <header class="viewer-head">
    <button class="icon-btn light" id="v-close" aria-label="Cerrar"><svg class="ico"><use href="#i-x"/></svg></button>
    <div class="viewer-title" id="v-title"></div>
    <label class="switch light"><input type="checkbox" id="v-wm" checked><span>Marca</span></label>
  </header>
  <div class="viewer-stage">
    <button class="v-nav prev" id="v-prev" aria-label="Foto anterior"><svg class="ico"><use href="#i-back"/></svg></button>
    <canvas id="v-canvas"></canvas>
    <button class="v-nav next" id="v-next" aria-label="Foto siguiente"><svg class="ico"><use href="#i-next"/></svg></button>
  </div>
  <div class="viewer-foot">
    <input class="v-caption" id="v-caption" placeholder="Descripción de la foto" autocomplete="off">
    <div class="v-meta" id="v-meta"></div>
    <div class="v-actions">
      <button class="icon-btn light" id="v-rotl" aria-label="Girar a la izquierda"><svg class="ico"><use href="#i-rotl"/></svg></button>
      <button class="icon-btn light" id="v-rotr" aria-label="Girar a la derecha"><svg class="ico"><use href="#i-rotr"/></svg></button>
      <button class="icon-btn light" id="v-map" aria-label="Ver en el mapa"><svg class="ico"><use href="#i-map"/></svg></button>
      <button class="icon-btn light" id="v-del" aria-label="Eliminar foto"><svg class="ico"><use href="#i-trash"/></svg></button>
    </div>
    <div class="v-buttons">
      <button class="btn ghost-light" id="v-share"><svg class="ico sm"><use href="#i-share"/></svg>Compartir</button>
      <button class="btn primary" id="v-save"><svg class="ico sm"><use href="#i-save"/></svg>Guardar foto</button>
    </div>
  </div>
</div>

<!-- Diálogo genérico -->
<div class="overlay dialog-wrap" id="dialog" hidden>
  <div class="dialog paper" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <div class="dlg-actions" id="dlg-actions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" accept="image/*" multiple id="gallery-input" hidden>
<input type="file" accept=".zip,application/zip" id="import-input" hidden>
<input type="file" accept="image/*" id="logo-input" hidden>
</body>
</html>
